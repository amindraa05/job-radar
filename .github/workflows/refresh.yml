name: Refresh job data

on:
  schedule:
    # 23:00 UTC = 06:00 Jakarta, so the board is current before the working day.
    - cron: "0 23 * * *"
  workflow_dispatch:
  push:
    paths:
      - "ingest/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The matcher decides what the dashboard shows. If its behaviour has
      # regressed, publishing stale-but-correct data beats publishing wrong data.
      - name: Test the matcher
        run: python ingest/test_match.py

      # Boards appear and disappear. Re-probing weekly keeps the source list
      # honest without paying the cost on every run.
      - name: Re-discover boards (Mondays only)
        continue-on-error: true
        run: |
          if [ "$(date -u +%u)" = "1" ]; then
            python ingest/discover.py
          else
            echo "Not Monday. Keeping the existing board list."
          fi

      - name: Fetch and score
        run: python ingest/run.py

      - name: Show the manifest
        run: cat docs/assets/run.json

      # A run that collected almost nothing usually means the network or an
      # upstream API failed. Committing that would wipe a working dashboard.
      - name: Refuse to publish an empty run
        run: |
          n=$(python -c "import json;print(len(json.load(open('docs/assets/jobs.json'))))")
          echo "rows: $n"
          if [ "$n" -lt 20 ]; then
            echo "::error::only $n rows, refusing to overwrite the published data"
            exit 1
          fi

      - name: Commit if the data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/jobs.json docs/assets/run.json ingest/boards.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi
